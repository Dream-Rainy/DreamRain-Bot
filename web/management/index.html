<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamRain 管理工作台</title><link rel="stylesheet" href="/arcade/aliases/portal.css"><link rel="stylesheet" href="/manage/app.css"><script defer src="/arcade/aliases/relay.js"></script><script defer src="/arcade/aliases/portal.js"></script><script defer src="/manage/clanbattle.js"></script><script defer src="/manage/app.js"></script></head>
<body><aside class="sidebar"><a class="brand" href="./"><span class="brand-mark">DR</span><span>DreamRain<small>管理工作台</small></span></a><div class="nav-label">工作空间</div><nav id="modules" aria-label="模块导航"></nav><div class="sidebar-foot">身份由机器人确认<br>临时会话 · 授权访问</div></aside>
<main class="workspace"><header class="topbar"><div><span class="eyebrow">DREAMRAIN / CONSOLE</span><h1 id="page-title">管理工作台</h1></div><div class="account"><span id="identity">等待连接</span><button id="logout" class="secondary" hidden>退出</button></div></header><div id="notice" role="status" aria-live="polite" hidden></div>
<section id="welcome" class="panel"><h2>连接你的机器人</h2><p>私聊机器人发送【管理后台 [群号]】，打开返回的临时链接。</p><p class="muted">链接最长一小时，请勿转发。断线后请重新获取链接。</p></section>
<section id="clan-panel" hidden><div class="toolbar"><form id="group-form"><label for="group-id">公会群</label><input id="group-id" inputmode="numeric" pattern="[1-9][0-9]*" maxlength="19" required placeholder="输入群号"><button>查看</button></form><span id="permission" class="muted"></span></div><nav id="clan-tabs" class="tabs" aria-label="会战报表"></nav><form id="editor-filters" class="editor-filters" aria-label="管理筛选" hidden></form><div class="report-heading"><div><h2 id="report-title">会战状态</h2><p id="report-meta" class="muted"></p></div><span id="refresh-state" class="refresh-state" role="status" aria-live="polite"></span><button id="refresh" class="secondary">刷新数据</button></div><div id="report" aria-live="polite"></div><div class="pager"><button id="previous" class="secondary" disabled>上一页</button><span id="page-number"></span><button id="next" class="secondary" disabled>下一页</button></div><p id="report-note" class="muted"></p></section>
<section id="aliases-panel" class="alias-panel" hidden></section></main></body></html>
